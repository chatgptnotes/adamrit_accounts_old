# Fluent Bit config: ship Adamrit audit logs to a WORM (S3 Object Lock) bucket.
#
# Pipeline: tail container logs → enrich with k8s metadata → merge the JSON log
# line → KEEP ONLY structured audit records (lines carrying an "action" field) →
# write batched JSONL objects to S3. Retention (6 years) is enforced by the
# BUCKET's Object Lock default retention, not by Fluent Bit — see README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-audit
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # Only tail the Adamrit app/sidecar containers (audit source).
    [INPUT]
        Name              tail
        Tag               audit.*
        Path              /var/log/containers/*adamrit*.log
        multiline.parser  cri,docker
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        DB                /var/fluent-bit/state/tail.db

    [FILTER]
        Name                kubernetes
        Match               audit.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # HIPAA: retain audit EVENTS, not all stdout noise. Keep only records that
    # carry an "action" field (every audit() / log() line emits one).
    [FILTER]
        Name    grep
        Match   audit.*
        Regex   action .+

    # Defense in depth: drop any field that looks like raw PHI even if a future
    # code path forgets the allowlist. (Belt-and-suspenders to sidecar/audit.js.)
    [FILTER]
        Name    record_modifier
        Match   audit.*
        Remove_key  patientName
        Remove_key  mrn
        Remove_key  diagnosis
        Remove_key  ssn
        Remove_key  dob

    [OUTPUT]
        Name                          s3
        Match                         audit.*
        bucket                        ${AUDIT_LOG_BUCKET}
        region                        ${AWS_REGION}
        total_file_size               5M
        upload_timeout                5m
        use_put_object                On
        s3_key_format                 /audit/%Y/%m/%d/adamrit-%H%M%S-$UUID.jsonl
        json_date_key                 ts
        json_date_format              iso8601
        store_dir                     /var/fluent-bit/s3
        store_dir_limit_size          1G
        retry_limit                   10

  parsers.conf: |
    [PARSER]
        Name         json
        Format       json
        Time_Key     ts
        Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep    On
